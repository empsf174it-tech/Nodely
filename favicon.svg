<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient (Obsidian to Elevated Surface) -->
    <linearGradient id="nodely-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1526"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Cyber Accent Gradient (Cool Indigo to Bright Cyan) -->
    <linearGradient id="nodely-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B98FF"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Top facet glass fill -->
    <linearGradient id="nodely-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B98FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="nodely-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B98FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="nodely-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#8B98FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B98FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle / Rounded Backdrop -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#nodely-bg)" stroke="url(#nodely-border)" stroke-width="1.2"/>
  
  <!-- Ambient glow in upper center -->
  <circle cx="16" cy="12" r="10" fill="url(#nodely-glow)" pointer-events="none"/>

  <!-- Nodely Smart Stack / Nodes Glyph -->
  <!-- Top Polygon (Facet) -->
  <polygon points="16,6.2 25.2,10.8 16,15.4 6.8,10.8" 
           fill="url(#nodely-facet)" 
           stroke="url(#nodely-gradient)" 
           stroke-width="1.75" 
           stroke-linejoin="round"/>

  <!-- Mid Chevron (Connecting layer) -->
  <polyline points="6.8,15.2 16,19.8 25.2,15.2" 
            fill="none" 
            stroke="url(#nodely-gradient)" 
            stroke-width="1.75" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.95"/>

  <!-- Bottom Chevron (Base layer) -->
  <polyline points="6.8,19.6 16,24.2 25.2,19.6" 
            fill="none" 
            stroke="url(#nodely-gradient)" 
            stroke-width="1.75" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.8"/>

  <!-- Central Smart Node Core Indicator -->
  <circle cx="16" cy="10.8" r="1.3" fill="#FFFFFF"/>
</svg>
